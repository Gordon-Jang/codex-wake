name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate WAKE metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          skill = Path("SKILL.md")
          agent = Path("agents/openai.yaml")
          watcher = Path("watcher/wake_watcher.py")

          assert skill.is_file()
          assert agent.is_file()
          assert watcher.is_file()

          text = skill.read_text(encoding="utf-8")
          assert text.startswith("---\n")
          assert re.search(r"(?m)^name:\s*wake\s*$", text)

          required = [
              "$wake",
              "$wake start",
              "$wake stop",
              "$wake status",
              "CODEX_THREAD_ID",
              "ordinaryUsageAllowed",
              "QUOTA_BLOCKED",
              "WAITING_USER",
              "BYMINUTE=0,15,30,45",
          ]
          for item in required:
              assert item in text, f"Missing required content: {item}"

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert version in {"0.2.0", "0.3.2"}

          watcher_text = watcher.read_text(encoding="utf-8")
          assert 'VERSION = "0.3.2"' in watcher_text

      - name: Compile watcher
        run: python -m py_compile watcher/wake_watcher.py

      - name: Check shell scripts
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done
