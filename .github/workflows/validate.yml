name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate SKILL.md
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("SKILL.md")
          assert path.is_file(), f"Missing {path}"

          text = path.read_text(encoding="utf-8")
          assert text.startswith("---\n"), "SKILL.md must start with YAML frontmatter"
          assert re.search(r"(?m)^name:\s*wake\s*$", text), "name must be wake"
          assert re.search(r"(?m)^description:\s*>?\s*$", text), "description is required"

          required = [
              "$wake",
              "$wake start",
              "$wake stop",
              "$wake status",
              "BYMINUTE=0,15,30,45",
          ]
          for item in required:
              assert item in text, f"Missing required content: {item}"

          print("SKILL.md validation passed.")

      - name: Check shell scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
