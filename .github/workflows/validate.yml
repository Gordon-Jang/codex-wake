name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate metadata and checkpoint-first contract
        shell: python
        run: |
          from pathlib import Path
          import re

          skill = Path("SKILL.md")
          agent = Path("agents/openai.yaml")
          watcher = Path("watcher/wake_watcher.py")
          docs = Path("docs/quota-watcher.md")

          for path in (skill, agent, watcher, docs):
              assert path.is_file(), f"Missing {path}"

          text = skill.read_text(encoding="utf-8")
          agent_text = agent.read_text(encoding="utf-8")
          watcher_text = watcher.read_text(encoding="utf-8")

          assert text.startswith("---\n")
          assert re.search(r"(?m)^name:\s*wake\s*$", text)
          for required in (
              "$wake", "$wake start", "$wake stop", "$wake status",
              "checkpoint", "quota_waiting", "needs_attention",
              "ordinaryUsageAllowed", "job-create-current", "job-complete",
          ):
              assert required in text, f"Missing SKILL contract: {required}"

          assert "codex exec resume" not in watcher_text
          assert '"exec"' in watcher_text
          assert "checkpoint.md" in watcher_text
          assert re.search(
              r"(?m)^\s*allow_implicit_invocation:\s*true\s*$",
              agent_text,
          )

      - name: Run Python tests
        run: |
          python -m py_compile watcher/wake_watcher.py
          python -m unittest discover -s tests -v

      - name: Check shell scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
          bash -n scripts/start-watcher.sh
          bash -n scripts/status-watcher.sh
          bash -n scripts/stop-watcher.sh
